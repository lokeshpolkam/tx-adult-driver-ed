<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <defs>
    <!-- Drop shadow for the barricade -->
    <filter id="barricadeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    
    <!-- Isometric Orange Stripe Pattern (MUTCD compliant 45-degree stripes) -->
    <pattern id="orangeStripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#FFFFFF"/>
      <rect x="12" width="12" height="24" fill="#EA580C"/>
    </pattern>
  </defs>

  <g filter="url(#barricadeShadow)">
    <!-- Ambient ground contact shadow -->
    <ellipse cx="95" cy="120" rx="75" ry="12" fill="#0f172a" opacity="0.25"/>

    <!-- Left Upright Post (Metallic Galvanized Steel) -->
    <rect x="42" y="25" width="6" height="92" rx="1" fill="#94A3B8"/>
    <rect x="44" y="25" width="2" height="92" fill="#CBD5E1"/>
    <!-- Left Base Feet (Inverted T-Base) -->
    <polygon points="25,124 65,116 65,119 25,127" fill="#64748B"/>

    <!-- Right Upright Post -->
    <rect x="142" y="42" width="6" height="92" rx="1" fill="#94A3B8"/>
    <rect x="144" y="42" width="2" height="92" fill="#CBD5E1"/>
    <!-- Right Base Feet -->
    <polygon points="125,141 165,133 165,136 125,144" fill="#64748B"/>

    <!-- Rails (3 Horizontal 8-inch Retroreflective Boards at 30-degree isometric slant) -->
    <!-- Rail 1 (Top) -->
    <g transform="skewY(16)">
      <rect x="18" y="25" width="154" height="15" rx="2" fill="url(#orangeStripes)" stroke="#C2410C" stroke-width="0.75"/>
      <!-- Board thickness/edge -->
      <rect x="18" y="38" width="154" height="2" fill="#475569" opacity="0.4"/>
      <!-- Mounting Bolts -->
      <circle cx="45" cy="32" r="1.5" fill="#334155"/>
      <circle cx="145" cy="32" r="1.5" fill="#334155"/>
    </g>

    <!-- Rail 2 (Middle) -->
    <g transform="skewY(16)">
      <rect x="18" y="48" width="154" height="15" rx="2" fill="url(#orangeStripes)" stroke="#C2410C" stroke-width="0.75"/>
      <rect x="18" y="61" width="154" height="2" fill="#475569" opacity="0.4"/>
      <circle cx="45" cy="55" r="1.5" fill="#334155"/>
      <circle cx="145" cy="55" r="1.5" fill="#334155"/>
    </g>

    <!-- Rail 3 (Bottom) -->
    <g transform="skewY(16)">
      <rect x="18" y="71" width="154" height="15" rx="2" fill="url(#orangeStripes)" stroke="#C2410C" stroke-width="0.75"/>
      <rect x="18" y="84" width="154" height="2" fill="#475569" opacity="0.4"/>
      <circle cx="45" cy="78" r="1.5" fill="#334155"/>
      <circle cx="145" cy="78" r="1.5" fill="#334155"/>
    </g>

    <!-- Center MUTCD Sign: ROAD CLOSED (R11-2) -->
    <g transform="translate(48, 38) skewY(16)">
      <rect x="0" y="0" width="94" height="34" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
      <rect x="2" y="2" width="90" height="30" rx="2" fill="none" stroke="#0F172A" stroke-width="0.75"/>
      <text x="47" y="14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8.5" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">ROAD CLOSED</text>
      <text x="47" y="26" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="6.5" fill="#DC2626" text-anchor="middle" letter-spacing="0.5">TERMINATING STEM</text>
    </g>
  </g>
</svg>
