<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <defs>
    <filter id="stopSignShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#stopSignShadow)">
    <!-- Base contact shadow -->
    <ellipse cx="40" cy="115" rx="12" ry="4" fill="#0f172a" opacity="0.3"/>

    <!-- Slender Aluminum Square-Tube Post with perforated holes -->
    <rect x="38" y="32" width="4" height="83" rx="0.5" fill="#94A3B8"/>
    <rect x="39" y="32" width="1.5" height="83" fill="#E2E8F0"/>

    <!-- 2.5D Isometric Rotated / Skewed Octagon Plate -->
    <g transform="translate(40, 30) scale(1, 0.85) rotate(-12)">
      <!-- Outer Red Octagon -->
      <polygon points="0,-24 17,-17 24,0 17,17 0,24 -17,17 -24,0 -17,-17" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
      <!-- Inner White Border Line -->
      <polygon points="0,-21.5 15.2,-15.2 21.5,0 15.2,15.2 0,21.5 -15.2,15.2 -21.5,0 -15.2,-15.2" fill="none" stroke="#FFFFFF" stroke-width="1.75"/>
      <!-- STOP Typography -->
      <text x="0" y="4.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">STOP</text>
    </g>
  </g>
</svg>
